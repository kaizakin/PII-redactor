syntax = "proto3";

// package redactor is the contract between the Go engine
// (internal/grpcclient) and the Python NLP worker (python-worker/):
// unstructured text PII (Analyze) and PII embedded in images, such as
// scanned IDs or screenshots (RedactImage).
//
// After editing this file, regenerate both languages' stubs — see
// the "Regenerating the gRPC contract" section in the repo README.
package redactor;

option go_package = "github.com/kaizakin/PII-redactor/proto/gen/redactor";

service NLPService {
  // Analyze finds unstructured PII entities (names, companies, addresses)
  // in free text using Named Entity Recognition.
  rpc Analyze(AnalyzeRequest) returns (AnalyzeResponse);

  // RedactImage finds PII in an image via OCR and returns the image with
  // solid black boxes drawn over the matched regions — never blurred or
  // pixelated, since both are reconstructible.
  rpc RedactImage(RedactImageRequest) returns (RedactImageResponse);
}

message AnalyzeRequest {
  string text = 1;
}

message AnalyzeResponse {
  repeated Entity entities = 1;
}

// Entity mirrors internal/grpcclient.Entity: a single unstructured PII
// span found in the analyzed text.
message Entity {
  // type is the entity label, e.g. "PERSON", "ORG", "ADDRESS". These are
  // the same labels internal/detector.NLPDetector filters on.
  string type = 1;
  // start and end are byte offsets into the text field of AnalyzeRequest,
  // matching the convention used by detector.Match in the Go engine.
  int32 start = 2;
  int32 end = 3;
  string text = 4;
  double confidence = 5;
}

message RedactImageRequest {
  bytes image_data = 1;
  // format is a lowercase image format hint ("png", "jpeg", "bmp", ...)
  // matching domain.ImageFormat values on the Go side (docxgo).
  string format = 2;
}

message RedactImageResponse {
  // image_data is the same image, re-encoded in the same format, with
  // every detected PII region blacked out. Unchanged (byte-identical)
  // if no PII was found.
  bytes image_data = 1;
  // redactions is how many regions were blacked out.
  int32 redactions = 2;
}
